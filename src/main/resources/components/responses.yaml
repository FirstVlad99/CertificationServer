UnauthorizedError:
  description: Пользователь не авторизован (токен отсутствует, протух или неверные учетные данные)
  content:
    application/json:
      schema:
        type: object
        required:
          - code
          - message
        properties:
          code:
            type: string
            description: Машиночитаемый код ошибки.
            example: 'INVALID_CREDENTIALS'
          message:
            type: string
            description: Человекочитаемое описание для разработчиков.
            example: 'Invalid login or password'

ConflictError:
  description: Конфликт с существующим ресурсом
  content:
    application/json:
      schema:
        type: object
        required:
          - code
          - message
        properties:
          code:
            type: string
            description: Машиночитаемый код ошибки.
            example: 'INVALID_CREDENTIALS'
          message:
            type: string
            description: Человекочитаемое описание для разработчиков.
            example: 'Invalid login or password'

BadRequestError:
  description: Ошибка валидации данных.
  content:
    application/json:
      schema:
        type: object
        required:
          - code
          - message
        properties:
          code:
            type: string
            description: Общий код ошибки валидации верхнего уровня.
            example: VALIDATION_FAILED
          message:
            type: string
            description: Человекочитаемое описание ошибки.
            example: Входные данные не прошли валидацию.
          fields:
            type: object
            description:
              Карта конкретных полей, не прошедших валидацию, и кодов ошибок для них.
              Ключ — имя поля в теле запроса
            additionalProperties:
              type: string
              enum:
                - REQUIRED_FIELD
                - INVALID_LENGTH
                - INVALID_FORMAT
                - WEAK_PASSWORD
                - INVALID_VALUE
                - ALREADY_EXISTS
                - VALIDATION_FAILED
                - INVALID_DATE_RANGE
            example:
              email: "REQUIRED_FIELD"
              password: "WEAK_PASSWORD"
