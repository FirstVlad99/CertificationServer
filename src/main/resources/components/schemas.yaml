schemas:
  UserRole:
    type: string
    enum: [ CUSTOMER,MEMBER, ADMIN ]

  LoginRequest:
    type: object
    required: [ email, password ]
    properties:
      email:
        type: string
        format: email
        example: v.pupkin@gmail.com
      password:
        type: string
        format: password
        minLength: 8
        example: "securePassword123"
      role:
        description: Роль, под которой хочет авторизоваться пользователь
        $ref: '#/schemas/UserRole'

  RegisterRequest:
    type: object
    required: [ email, password ]
    properties:
      email:
        type: string
        format: email
        example: v.pupkin@gmail.com
      password:
        type: string
        format: password
        minLength: 8
        example: "securePassword123"

  TokensMobileResponse:
    type: object
    required: [access_token, refresh_token]
    properties:
      access_token:
        type: string
        description: Короткоживущий токен. Используется в Authorization Bearer при любом запросе к API
        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM1MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c'
      refresh_token:
        type: string
        description: Долгоживущий токен. Используется для обновления пары (access_token,refresh_token) при истечении access_token
        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM1MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c'

  LogoutMobileRequest:
    type: object
    required: [ refresh_token ]
    properties:
      refresh_token:
        type: string
        description: Долгоживущий токен. Используется для обновления пары (access_token,refresh_token) при истечении access_token
        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM1MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c'

  RefreshMobileRequest:
    type: object
    required: [ refresh_token ]
    properties:
      refresh_token:
        type: string
        description: Долгоживущий токен. Используется для обновления пары (access_token,refresh_token) при истечении access_token
        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM1MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c'

  ActivateAccountRequest:
    type: object
    required: [ code ]
    properties:
      code:
        type: string
        description: Код активации

  ResetPasswordRequest:
    type: object
    required: [ code, new_password ]
    properties:
      code:
        type: string
        description: Одноразовый код, полученный из письма.
        example: "6676"
      new_password:
        type: string
        format: password
        description: >
          Новый пароль пользователя. Обязательны хотя бы одна латинская буква, хотя бы одна цифра
          и хотя бы один спецсимвол; другие символы, включая кириллицу и пробел, не принимаются.
          Нарушение правила - `WEAK_PASSWORD` в `fields`, нарушение длины - `INVALID_LENGTH`.
        minLength: 8
        example: "SecretPassword2026!"

  ForgotPasswordRequest:
    type: object
    required: [ email ]
    properties:
      email:
        type: string
        format: email
        example: vladislw.pankov@gmail.com

  ResendActivationRequest:
    type: object
    required: [ email ]
    properties:
      email:
        type: string
        format: email
        example: vladislw.pankov@gmail.com