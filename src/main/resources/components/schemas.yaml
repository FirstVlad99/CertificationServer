schemas:
  UserRole:
    type: string
    enum: [ CUSTOMER,MEMBER, ADMIN ]

  LoginRequest:
    type: object
    required: [ email, password ]
    properties:
      email:
        type: string
        format: email
        example: v.pupkin@gmail.com
      password:
        type: string
        format: password
        minLength: 8
        example: "securePassword123"
      role:
        description: Роль, под которой хочет авторизоваться пользователь
        $ref: '#/schemas/UserRole'

  RegisterRequest:
    type: object
    required: [ email, password ]
    properties:
      email:
        type: string
        format: email
        example: v.pupkin@gmail.com
      password:
        type: string
        format: password
        minLength: 8
        example: "securePassword123"

  TokensMobileResponse:
    type: object
    required: [access_token, refresh_token]
    properties:
      access_token:
        type: string
        description: Короткоживущий токен. Используется в Authorization Bearer при любом запросе к API
        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM1MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c'
      refresh_token:
        type: string
        description: Долгоживущий токен. Используется для обновления пары (access_token,refresh_token) при истечении access_token
        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM1MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c'

  LogoutMobileRequest:
    type: object
    required: [ refresh_token ]
    properties:
      refresh_token:
        type: string
        description: Долгоживущий токен. Используется для обновления пары (access_token,refresh_token) при истечении access_token
        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM1MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c'

  RefreshMobileRequest:
    type: object
    required: [ refresh_token ]
    properties:
      refresh_token:
        type: string
        description: Долгоживущий токен. Используется для обновления пары (access_token,refresh_token) при истечении access_token
        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM1MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c'
