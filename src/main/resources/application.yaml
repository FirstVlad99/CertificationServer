spring:
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:10MB}
  config:
    import: optional:file:.env[.properties]
  application:
    name: ${APP_NAME:Certification Server}
    url: ${APP_URL:http://localhost:8080}
  mvc:
    servlet:
      path: /api/v1
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:6542/cert}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis}

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.springframework.security.web: ${LOG_LEVEL_SECURITY_WEB:INFO}
    org.springframework.web: ${LOG_LEVEL_WEB:INFO}
    ru.cert.certificationserver: ${LOG_LEVEL_APP:DEBUG}
