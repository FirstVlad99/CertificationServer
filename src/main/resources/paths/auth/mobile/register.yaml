post:
  operationId: register
  summary: Регистрация в системе
  description: |
    Регистрирует пользователя в системе, если учетной записи с таким email нет. 
    Бэкенд только создает учетную запись пользователя с ролью CUSTOMER, статусом PENDING_CONFIRMATION.
  tags:
    - auth
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/schemas/RegisterRequest'
  responses:
    '201':
      description: Аккаунт пользователя создан.
    '401':
      $ref: '../../../components/responses.yaml#/UnauthorizedError'
    '409':
      $ref: '../../../components/responses.yaml#/ConflictError'
    '400':
      $ref: '../../../components/responses.yaml#/BadRequestError'