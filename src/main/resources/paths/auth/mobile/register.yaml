post:
  operationId: register
  summary: Регистрация в системе
  description: |
    Регистрирует пользователя в системе, если учетной записи с таким email нет. 
    Бэкенд генерирует и возвращает access и refresh токены.
  tags:
    - auth
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/schemas/RegisterRequest'
  responses:
    '200':
      description: Успешный вход. Токены переданы в теле ответа.
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas.yaml#/schemas/TokensMobileResponse'
    '401':
      $ref: '../../../components/responses.yaml#/UnauthorizedError'
    '409':
      $ref: '../../../components/responses.yaml#/ConflictError'
    '422':
      $ref: '../../../components/responses.yaml#/BadRequestError'