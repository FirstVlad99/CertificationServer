post:
  operationId: forgotPassword
  summary: Запрос на восстановление пароля (отправка email)
  description: Принимает email пользователя. 
    Если такой пользователь существует, бэкенд генерирует одноразовый код и отправляет на почту код для сброса пароля. 
    В целях безопасности эндпоинт всегда должен возвращать 200 OK.
  tags:
    - auth
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/schemas/ForgotPasswordRequest'
  responses:
    '204':
      description: Запрос принят. Если email зарегистрирован в системе, письмо со ссылкой отправлено.
    '400':
      $ref: '../../../components/responses.yaml#/BadRequestError'