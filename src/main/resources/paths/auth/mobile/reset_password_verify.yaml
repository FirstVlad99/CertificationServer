get:
  operationId: verifyResetToken
  summary: Проверка валидности кода сброса пароля
  description: Позволяет клиенту проверить код из ссылки до того, как показывать пользователю экран ввода нового пароля.
  tags:
    - auth
  security: []
  parameters:
    - name: X-Reset-Password-Code
      in: header
      required: true
      description: Код восстановления из ссылки на почте
      schema:
        type: string
  responses:
    '204':
      description: Код валиден, можно рендерить форму смены пароля.
    '400':
      $ref: '../../../components/responses.yaml#/BadRequestError'