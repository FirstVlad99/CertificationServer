post:
  operationId: resetPassword
  summary: Сброс пароля с использованием кода
  description: Принимает user_id, одноразовый код из письма и новый пароль. 
    Проверяет валидность user_id, кода, срок действия кода, после чего обновляет пароль пользователя в системе. 
    После успешного сброса все текущие активные сессии пользователя должны быть инвалидированы.
  tags:
    - auth
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas.yaml#/schemas/ResetPasswordRequest'
  responses:
    '204':
      description: Пароль успешно изменен. Теперь пользователь может авторизоваться.
    '400':
      $ref: '../../../components/responses.yaml#/BadRequestError'